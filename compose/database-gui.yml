# =============================================================================
# 数据库 GUI 模块（compose/database-gui.yml）
# =============================================================================

services:
  # 12. RedisInsight（Redis GUI 可视化管理）
  redisinsight:
    image: redis/redisinsight@sha256:b5e19ee240abef6edb435871b90ff8a210995422e8e018ab61c0339d318a1f84
    container_name: dev-redisinsight
    ports:
      - "5540:5540"
    environment:
      - TZ=Asia/Shanghai
    restart: always

  # 13. CloudBeaver（DBeaver 网页版，现代 UI、中文友好，支持 MySQL / PostgreSQL / SQLite / MariaDB 等多库）
  cloudbeaver:
    image: dbeaver/cloudbeaver:24.04
    container_name: dev-cloudbeaver
    ports:
      - "8978:8978"
    environment:
      - TZ=Asia/Shanghai
    restart: always

  # 14. NaviDog（轻量 Web 端 MySQL 管理工具，Navicat 风格、中文原生；仅 MySQL）
  #     官方仅提供 npm 包，镜像在 ../dev-navidog 自建（上游硬编码监听 127.0.0.1，已在 Dockerfile 改为 HOST 可配）
  navidog:
    build:
      context: ../dev-navidog
    image: dev-navidog:latest
    container_name: dev-navidog
    ports:
      - "3001:3001"
    environment:
      - TZ=Asia/Shanghai
      - HOST=0.0.0.0
      - PORT=3001
    restart: always
