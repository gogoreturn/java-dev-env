# MinIO 对象存储（S3 兼容）
# 归属域：core
services:
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: dev-minio
    profiles: [minio]
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台 Web UI
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin123
      - TZ=Asia/Shanghai
    command: server /data --console-address ":9001"
    volumes:
      - ../dev-minio/data:/data
    restart: always
