# 基础网络配置
bind 0.0.0.0
protected-mode no
port 6379
tcp-keepalive 300

# 通用配置
daemonize no
loglevel notice
logfile /var/log/redis/redis.log
databases 16

# 快照持久化 (RDB)
save 900 1
save 300 10
save 60 10000

# AOF 持久化 (建议开启)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 内存管理
maxmemory 512mb
maxmemory-policy allkeys-lru

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128

# 访问密码
requirepass 123456
