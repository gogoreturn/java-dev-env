# =============================================================================
# java-dev-env 主编排文件
# -----------------------------------------------------------------------------
# 采用「模块化」组织：本文件只做编排，不内联任何服务定义。
# 各业务模块拆分到 compose/ 下的独立文件，通过 include 引入。
# 好处：改某个模块只需动对应文件，互不影响；可按需增删模块。
#
# 模块一览（compose/ 目录）：
#   core.yml        核心基础设施：jrebel / redis / mysql / nginx / rabbitmq / minio
#   search.yml      搜索引擎：elasticsearch 7 / 8 / 9
#   messaging.yml   消息队列：kafka / kafka-ui
#   database-gui.yml 数据库 GUI：cloudbeaver / navidog / redisinsight
#   tools.yml       工具箱：it-tools
#
# 说明：
#   - include 进来的文件里，相对路径（build 上下文、volume 挂载）都以该文件
#     自身所在目录（compose/）为基准，故各模块内的 ./dev-xxx 都写成 ../dev-xxx。
#   - 所有模块共享同一个项目名 java-dev-env，因此跨模块按服务名互访（同一默认网络）。
#   - 启动方式不变：在仓库根目录 `bash script/start.sh` 即可拉起全部模块。
# =============================================================================

name: java-dev-env

include:
  - compose/core.yml
  - compose/search.yml
  - compose/messaging.yml
  - compose/database-gui.yml
  - compose/tools.yml
