# Kafka UI（Kafka 可视化管理，连接 compose 内 kafka 的 INTERNAL 监听器 kafka:9094）
# 归属域：messaging
services:
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: dev-kafka-ui
    profiles: [kafka-ui]
    ports:
      - "10083:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9094
      - TZ=Asia/Shanghai
    restart: always
