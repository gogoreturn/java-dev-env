map $sent_http_content_type $content_disposition {
    default "attachment";
    "text/html" "";
    "application/pdf" "";
    "text/plain" "";
}

server {
    listen 80 default_server;
    server_name localhost;

    location / {
        alias /data/html/;
        index index.html;
        autoindex on;

        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'Origin, Content-Type, Accept, Authorization';
        add_header Access-Control-Allow-Credentials true;
    }


    location /file/ {
        alias /data/file/;
        autoindex on;

        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
        add_header Access-Control-Allow-Headers 'Origin, Content-Type, Accept, Authorization';
        add_header Access-Control-Allow-Credentials true;

        # 对于OPTIONS预检请求，直接返回204
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
            add_header Access-Control-Allow-Headers 'Origin, Content-Type, Accept, Authorization';
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # 自定义 MIME 类型
        types {
            text/html html;
            application/pdf pdf;
            text/plain txt;
            application/msword doc;
            application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
            application/vnd.ms-powerpoint ppt;
            application/vnd.openxmlformats-officedocument.presentationml.presentation pptx;
            application/vnd.ms-excel xls;
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet xlsx;
            application/zip zip;
            application/x-rar-compressed rar;
            image/png png;
            image/jpeg jpg jpeg;
        }

        # 根据文件类型动态添加响应头
        add_header Content-Disposition $content_disposition;
    }

    # 2. 代理 JRebel (访问路径: http://localhost/jrebel)
    location /jrebel/ {
        proxy_pass http://dev-jrebelServer:8081/;
        proxy_set_header Host $host;
    }

    location /tools {
        return 301 http://$host:10081/;
    }

    location /grafana {
        return 301 http://$host:10091/;
    }
}

server {
    listen 81;

    location / {
        # 1. 核心：强制重写用户信息（由网关控制身份）
        # 先清空可能存在的外部注入，再赋予 Shine 系统确定的身份
        proxy_set_header X-WebUI-User "user@local.dev";

        # 2. 基础代理设置
        proxy_pass http://host.docker.internal:10083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 3. 支持 WebSocket（Open-WebUI 流式输出必须）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 4. 优化超时配置（防止 AI 生成长文本时连接断开）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
